<style>

/* ===== BODY ===== */

body {
margin:0;
font-family:'Montserrat',sans-serif;
background:white;
scroll-behavior:smooth;
}

/* ===== BLOKADA SCROLLA ===== */

.no-scroll {
overflow:hidden;
}

/* ===== NAV ===== */

nav {

position:fixed;
top:0;
width:100%;

background:white;
border-bottom:1px solid #eee;

padding:18px 0;

z-index:999;

}

.nav-container {

max-width:1150px;
margin:auto;

display:flex;
justify-content:space-between;
align-items:center;

padding:0 25px;

}

.logo {

font-family:'Playfair Display',serif;
font-size:22px;
letter-spacing:3px;

text-decoration:none;
color:#111;

}

.logo:hover {

opacity:0.7;

}

/* ===== HAMBURGER ===== */

.hamburger {

font-size:28px;
cursor:pointer;

z-index:1001;

}

/* ===== MENU ===== */

.menu {

position:fixed;

top:0;
right:0;

width:300px;
height:100vh;

background:white;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

transform:translateX(100%);
transition:0.3s;

box-shadow:-5px 0 15px rgba(0,0,0,0.1);

z-index:1000;

}

.menu.active {

transform:translateX(0);

}

.menu a {

text-decoration:none;
color:#111;

padding:18px;

font-size:13px;
letter-spacing:2px;

transition:0.3s;

}

.menu a:hover {

color:#888;

}

/* ===== CLOSE MENU ===== */

.close-menu {

position:absolute;
top:20px;
right:25px;

font-size:28px;
cursor:pointer;

}

/* ===== OVERLAY ===== */

.overlay {

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,0.3);

opacity:0;
pointer-events:none;

transition:0.3s;

z-index:900;

}

.overlay.active {

opacity:1;
pointer-events:auto;

}

/* ===== BACK LINK ===== */

.back-link {

display:inline-block;

margin-top:140px;
margin-left:40px;

font-size:13px;
letter-spacing:2px;

text-decoration:none;

color:#111;

transition:0.3s;

}

.back-link:hover {

opacity:0.6;

}

/* ===== HERO ===== */

.faq-hero {

margin-top:120px;

width:100%;

display:flex;
justify-content:center;

}

.faq-hero img {

width:100%;
max-width:1100px;

height:420px;

object-fit:cover;

}

/* ===== HEADER ===== */

.faq-header {

text-align:center;

padding:60px 20px 40px;

}

.faq-header h1 {

font-family:'Playfair Display',serif;

font-size:48px;
letter-spacing:4px;

margin:0;

}

.faq-header p {

margin-top:15px;

font-size:13px;
letter-spacing:3px;

color:#555;

}

/* ===== FAQ ===== */

.faq-container {

max-width:800px;
margin:auto;

padding:40px 20px 80px;

}

.faq-item {

border-bottom:1px solid #eee;

}

.faq-question {

width:100%;

background:none;
border:none;

padding:26px 10px;

font-family:'Montserrat',sans-serif;
font-size:15px;

font-weight:600;

cursor:pointer;

letter-spacing:1px;

display:flex;
justify-content:space-between;
align-items:center;

text-align:left;

}

.arrow {

transition:0.3s;
font-size:14px;

}

.faq-question.active .arrow {

transform:rotate(180deg);

}

.faq-answer {

max-height:0;
overflow:hidden;

transition:0.35s ease;

}

.faq-answer p {

margin:0;

padding:0 10px 22px 10px;

font-size:14px;
line-height:1.7;

color:#444;

}

/* MOBILE */

@media (max-width:768px){

.faq-hero img {
height:260px;
}

.faq-header h1 {
font-size:30px;
}

.back-link {
margin-left:20px;
}

}

</style>
